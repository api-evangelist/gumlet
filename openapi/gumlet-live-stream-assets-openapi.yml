    delete:
      summary: Delete Live Asset
      description: This endpoint removes a live asset given its unique live asset id. The live asset will
        be removed from storage as well, associated URLs will be inaccessible.
      operationId: delete-live-asset
      parameters:
      - name: live_asset_id
        in: path
        description: Live asset id of the live asset which needs to be deleted.
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request — invalid live asset
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: live_asset_not_found
                      message: Live Video Asset not found.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: live_asset_not_found
                      message:
                        type: string
                        example: Live Video Asset not found.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          description: Unauthorized — live stream cannot be deleted in preparing state
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: livestream_can_not_be_deleted
                      message: The live stream cannot be deleted while in the preparing state.
              schema:
