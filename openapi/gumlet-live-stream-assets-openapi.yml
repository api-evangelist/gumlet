                live_asset_id:
                  type: string
                  description: Gumlet live video asset id.
                statuses:
                  description: Thumbnail states to upload. You can send an array or a comma-separated
                    string.
                  oneOf:
                  - type: array
                    items:
                      type: string
                      enum:
                      - preparing
                      - disconnected
                      - end
                  - type: string
                    example: preparing,disconnected
