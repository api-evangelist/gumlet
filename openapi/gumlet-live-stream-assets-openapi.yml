openapi: 3.1.0
info:
  title: Gumlet Live Stream Assets API
  version: '1.4'
  description: Live Stream Assets operations of the Gumlet API.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
servers:
- url: https://api.gumlet.com/v1
tags:
- name: Live Stream Assets
paths:
  /video/live/assets:
    post:
      summary: Create Live Asset
      description: A live asset refers to media content/video that is live-streamed through Gumlet. This
        endpoint creates a live streaming asset allowing users to live stream a video that will be pushed
        to Gumlet.
      operationId: create-live-asset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - live_source_id
              - resolution
              properties:
                live_source_id:
                  type: string
                  description: Gumlet live video source/collection id.
                resolution:
                  type: string
                  description: 'Required resolutions in HLS delivery format for live stream. Can be an
                    array of string out of the following values: `240p`, `360p`, `480p`, `540p`, `720p`,
                    and `1080p`. Resized rendition will retain the input aspect ratio.'
                title:
                  type: string
                  description: Your live stream asset title
                mp4_access:
                  type: boolean
                  description: Creates <code>MP4</code> version for download purpose.
                orientation:
                  type: string
                  enum:
                  - landscape
                  - potrait
                start_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: created
                    stream_key: 68c3da5947f9ad0c0d513fe3
                    live_asset_id: 68c3da5947f9ad0c0d513fe2
                    live_video_source_id: 67e4ecea403562dbea654269
                    input:
                      resolution:
                      - 360p
                      - 480p
                      - 720p
                      - 240p
                      - 1080p
                      title: gumlet-stream
                    stream_url: rtmp://44.245.28.195:1935/app/68c3da5947f9ad0c0d513fe3
                    output:
                      playback_url: https://stream.gumlet.io/67e4ecea403562dbea654269/68c3da5947f9ad0c0d513fe2/main.m3u8
                      recording_playback_url: https://video.gumlet.io/6867815b6410daa283f85532/68c3da5947f9ad0c0d513fe4/main.m3u8
                      recording_dash_playback_url: https://video.gumlet.io/6867815b6410daa283f85532/68c3da5947f9ad0c0d513fe4/main.mpd
                    vod_asset_id: 68c3da5947f9ad0c0d513fe4
                    created_at: 1757665882451
                    updated_at: 1757665882451
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: created
                  stream_key:
                    type: string
                    example: 619231610822a81d955d22f4
                  live_asset_id:
                    type: string
                    example: 619231610822a81d955d22f3
                  live_video_source_id:
                    type: string
                    example: 6165247368d80232d28d4379
                  input:
                    type: object
                    properties:
                      resolution:
                        type: array
                        items:
                          type: string
                          example: 720p
                      title:
                        type: string
                  stream_url:
                    type: string
                    example: rtmp://livestream-ingest.gumlet.io:1935/app/619231610822a81d955d22f4
                  output:
                    type: object
                    properties:
                      playback_url:
                        type: string
                        example: https://video.gumlet.io/6165247368d80232d28d4379/619231610822a81d955d22f3/master.m3u8
                      recording_playback_url:
                        type: string
                      recording_dash_playback_url:
                        type: string
                  thumbnail:
                    type: object
                    properties:
                      preparing:
                        type: string
                        example: https://stream.gumlet.io/67e4ecea403562dbea654269/68c3da5947f9ad0c0d513fe2/thumbnail-preparing.png
                      disconnected:
                        type: string
                        example: https://stream.gumlet.io/67e4ecea403562dbea654269/68c3da5947f9ad0c0d513fe2/thumbnail-disconnected.png
                      end:
                        type: string
                        example: https://stream.gumlet.io/67e4ecea403562dbea654269/68c3da5947f9ad0c0d513fe2/thumbnail-end.png
                  created_at:
                    type: integer
                    example: 1636970849188
                    default: 0
                  updated_at:
                    type: integer
                    example: 1636970849188
                    default: 0
                  vod_asset_id:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: parameter_missing
                      message: One or more required values are missing.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_missing
                      message:
                        type: string
                        example: One or more required values are missing.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: source_not_found
                      message: Could not find any video source with specified source ID.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: source_not_found
                      message:
                        type: string
                        example: Could not find any video source with specified source ID.
        '403':
          description: Forbidden — monthly live streaming quota exceeded
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: live_stream_monthly_usage_quota_exceeded
                      message: You have already exceeded your monthly quota for live streaming usage.
                        Please upgrade your plan.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: live_stream_monthly_usage_quota_exceeded
                      message:
                        type: string
                        example: You have already exceeded your monthly quota for live streaming usage.
                          Please upgrade your plan.
                    required:
                    - code
                    - message
                required:
                - error
        '422':
          $ref: '#/components/responses/ValidationError'
      deprecated: false
      tags:
      - Live Stream Assets
      x-stoplight:
        id: cka42lfc4c8hf
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst liveStreamAsset = await client.liveStreamAssets.create({\n\
          \  live_source_id: '',\n  resolution: '',\n});\n\nconsole.log(liveStreamAsset);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nlive_stream_asset = client.live_stream_assets.create(\n    live_source_id=\"\
          \",\n    resolution=\"\",\n)\n\nprint(live_stream_asset)"
