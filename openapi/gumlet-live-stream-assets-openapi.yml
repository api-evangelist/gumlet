  /video/live/assets/{live_asset_id}/complete:
    post:
      summary: Complete Live Stream
      description: This endpoint allows marking live assets complete. Once the live asset is marked complete,
        it can no longer be used to ingest the live stream on Gumlet.
      operationId: complete-live-stream
      parameters:
      - name: live_asset_id
        in: path
        description: Live asset id of the live stream which needs to be completed.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
