openapi: 3.1.0
info:
  title: Gumlet Video Playlists API
  version: '1.4'
  description: Video Playlists operations of the Gumlet API.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
servers:
- url: https://api.gumlet.com/v1
tags:
- name: Video Playlists
paths:
  /video/playlist:
    post:
      summary: Create Playlist
      description: Create new playlist inside video wprkspace
      operationId: create-playlist
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - collection_id
              - title
              properties:
                collection_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
            examples:
              Request Example:
                value:
                  title: Playlist-Title
                  description: This is description for playlist.
                  collection_id: '{{video-source-id}}'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 659693cadc46251d898930f2
                    collection_id: 646df1c9173a4a2fcac180b4
                    title: Playlist-Title
                    description: This is description for playlist.
                    player_config:
                      preload: false
                      autoplay: false
                      disable_seek: false
                      disable_player_controls: false
                      powered_by_gumlet_overlay: false
                      allow_drm_protected_videos: false
                      loop: false
                      player_color: '#6658ea'
                      include_seo: true
                      subtitle_enabled: false
                      pixel_tags: {}
                      logo_width: 100
                      logo_height: 100
                      dynamic_watermark: false
                      watermark_font_size: 20
                      watermark_font_color: '#ff0000'
                      watermark_bg_color: transparent
                      watermark_interval: 1000
              schema:
                type: object
                properties:
                  id:
                    type: string
                    examples:
                    - 659693cadc46251d898930f2
                  collection_id:
                    type: string
                    examples:
                    - 646df1c9173a4a2fcac180b4
                  title:
                    type: string
                    examples:
                    - Playlist-Title
                  description:
                    type: string
                    examples:
                    - This is description for playlist.
                  player_config:
                    type: object
                    properties:
                      preload:
                        type: boolean
                        default: true
                        examples:
                        - false
                      autoplay:
                        type: boolean
                        default: true
                        examples:
                        - false
                      disable_seek:
                        type: boolean
                        default: true
                        examples:
                        - false
                      disable_player_controls:
                        type: boolean
                        default: true
                        examples:
                        - false
                      powered_by_gumlet_overlay:
                        type: boolean
                        default: true
                        examples:
                        - false
                      allow_drm_protected_videos:
                        type: boolean
                        default: true
                        examples:
                        - false
                      loop:
                        type: boolean
                        default: true
                        examples:
                        - false
                      player_color:
                        type: string
                        examples:
                        - '#6658ea'
                      include_seo:
                        type: boolean
                        default: true
                        examples:
                        - true
                      subtitle_enabled:
                        type: boolean
                        default: true
                        examples:
                        - false
                      pixel_tags:
                        type: object
                        properties: {}
                        x-apidog-orders: []
                      logo_width:
                        type: integer
                        default: 0
                        examples:
                        - 100
                      logo_height:
                        type: integer
                        default: 0
                        examples:
                        - 100
                      dynamic_watermark:
                        type: boolean
                        default: true
                        examples:
                        - false
                      watermark_font_size:
                        type: integer
                        default: 0
                        examples:
                        - 20
                      watermark_font_color:
                        type: string
                        examples:
                        - '#ff0000'
                      watermark_bg_color:
                        type: string
                        examples:
                        - transparent
                      watermark_interval:
                        type: integer
                        default: 0
                        examples:
                        - 1000
                    x-apidog-orders:
                    - preload
                    - autoplay
                    - disable_seek
                    - disable_player_controls
                    - powered_by_gumlet_overlay
                    - allow_drm_protected_videos
                    - loop
                    - player_color
                    - include_seo
                    - subtitle_enabled
                    - pixel_tags
                    - logo_width
                    - logo_height
                    - dynamic_watermark
                    - watermark_font_size
                    - watermark_font_color
                    - watermark_bg_color
                    - watermark_interval
                x-apidog-orders:
                - id
                - collection_id
                - title
                - description
                - player_config
                required:
                - id
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: title_duplication
                      message: A playlist with this title already exist. All playlist titles under a workspace
                        should be unique.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: title_duplication
                      message:
                        type: string
                        example: A playlist with this title already exist. All playlist titles under a
                          workspace should be unique.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      deprecated: false
      tags:
      - Video Playlists
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst videoPlaylist = await client.videoPlaylists.create({\n\
          \  title: 'Playlist-Title',\n  description: 'This is description for playlist.',\n  collection_id:\
          \ '{{video-source-id}}',\n});\n\nconsole.log(videoPlaylist);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nvideo_playlist = client.video_playlists.create(\n    collection_id=\"{{video-source-id}}\"\
          ,\n    title=\"Playlist-Title\",\n    description=\"This is description for playlist.\",\n)\n\
          \nprint(video_playlist)"
    get:
      summary: Get all playlists
      description: Get all playlists for given workspace
      operationId: get-all-playlists
      parameters:
      - name: collection_id
        in: query
        description: Video Collection ID
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - id: 6566ebd57499c676fe302bfc
                    collection_id: 646df1c9173a4a2fcac180b4
                    title: Playlist-1
                    description: This is updated description
                    player_config: {}
                  - id: 65802cc5bda4c3f74c99eacf
                    collection_id: 646df1c9173a4a2fcac180b4
                    title: Playlist-2
                    player_config: {}
                  - id: 65802cc6bda4c3f74c99eae5
                    collection_id: 646df1c9173a4a2fcac180b4
                    title: Playlist-3
                    player_config: {}
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      examples:
                      - 6566ebd57499c676fe302bfc
                    collection_id:
                      type: string
                      examples:
                      - 646df1c9173a4a2fcac180b4
                    title:
                      type: string
                      examples:
                      - Playlist-1
                    description:
                      type: string
                      examples:
                      - This is updated description
                    player_config:
                      type: object
                      properties: {}
                      x-apidog-orders: []
                  x-apidog-orders:
                  - id
                  - collection_id
                  - title
                  - description
                  - player_config
                  required:
                  - id
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: collection_not_found
                      message: Could not find any video collection with specified collection_id.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: collection_not_found
                      message:
                        type: string
                        example: Could not find any video collection with specified collection_id.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: false
      tags:
      - Video Playlists
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst videoPlaylist = await client.videoPlaylists.listAll();\n\
          \nconsole.log(videoPlaylist);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nvideo_playlist = client.video_playlists.list_all()\n\nprint(video_playlist)"
  /video/playlist/{playlist_id}/asset:
    post:
      summary: Add asset to playlist
      description: This operation adds a single asset or a list of assets to a playlist.
      operationId: add-asset-playlist
      parameters:
      - name: playlist_id
        description: Playlist ID in which the asset needs to be added.
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - asset_list
              properties:
                asset_list:
                  type: array
                  items:
                    properties:
                      asset_id:
                        type: string
                      position:
                        type: integer
                        description: Optional, if not provided asset will added at the back/last of playlist
                        format: int32
                    type: object
            examples:
              Request Example:
                value:
                  asset_list:
                  - asset_id: 6508790283e4d60611846790
                  - position: 1
                    asset_id: 650878f883e4d6061184677d
                  - asset_id: 650878de83e4d6061184676a
                  - position: 2
                    asset_id: 650878d883e4d60611846757
                  - position: 3
                    asset_id: 65578dd87eebc22dcdd549a2
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: incorrect_playlist_id
                      message: No playlist with provided id exists.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: incorrect_playlist_id
                      message:
                        type: string
                        example: No playlist with provided id exists.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: false
      tags:
      - Video Playlists
      x-stoplight:
        id: udtlsqhehl96y
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst videoPlaylist = await client.videoPlaylists.createAsset('playlistId',\
          \ {\n  asset_list: [\n    { asset_id: '6508790283e4d60611846790' },\n    { position: 1, asset_id:\
          \ '650878f883e4d6061184677d' },\n    { asset_id: '650878de83e4d6061184676a' },\n    { position:\
          \ 2, asset_id: '650878d883e4d60611846757' },\n    { position: 3, asset_id: '65578dd87eebc22dcdd549a2'\
          \ },\n  ],\n});\n\nconsole.log(videoPlaylist);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nvideo_playlist = client.video_playlists.create_asset(\n    playlist_id=\"\
          playlistId\",\n    asset_list=[\n        {\"asset_id\": \"6508790283e4d60611846790\"},\n   \
          \     {\"position\": 1, \"asset_id\": \"650878f883e4d6061184677d\"},\n        {\"asset_id\"\
          : \"650878de83e4d6061184676a\"},\n        {\"position\": 2, \"asset_id\": \"650878d883e4d60611846757\"\
          },\n        {\"position\": 3, \"asset_id\": \"65578dd87eebc22dcdd549a2\"},\n    ],\n)\n\nprint(video_playlist)"
    delete:
      summary: Remove asset from playlist
      description: Removed an asset or list of assets from a given playlist.
      operationId: remove-asset-playlist
      parameters:
      - name: playlist_id
        description: Playlist ID that is to be deleted.
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - delete_list
              properties:
                delete_list:
                  type: array
                  description: Array of video asset ids.
                  items:
                    type: string
            examples:
              Request Example:
                value:
                  delete_list:
                  - 6508790783e4d606118467a3
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: incorrect_playlist_id
                      message: No playlist with provided id exists.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: incorrect_playlist_id
                      message:
                        type: string
                        example: No playlist with provided id exists.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: false
      tags:
      - Video Playlists
      x-stoplight:
        id: j7pd61w7qxzcy
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst videoPlaylist = await client.videoPlaylists.deleteAsset('playlistId',\
          \ {\n  delete_list: ['6508790783e4d606118467a3'],\n});\n\nconsole.log(videoPlaylist);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nvideo_playlist = client.video_playlists.delete_asset(\n    playlist_id=\"\
          playlistId\",\n    delete_list=[\"6508790783e4d606118467a3\"],\n)\n\nprint(video_playlist)"
  /video/playlist/{playlist_id}:
    post:
      summary: Update Playlist
      description: This endpoint allows you to update playlist name, channel visibility, or playlist order
        on a channel page.
      operationId: update-playlist
      parameters:
      - name: playlist_id
        description: ID for the playlist to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                position:
                  type: integer
                  description: Playlists have order in which they will be shown on the channel page.
                  format: int32
                player_config:
                  type: object
                  description: Configure player settings for this playlist, it overrides the setting set
                    on collection.
                  properties:
                    preload:
                      type: boolean
                    autoplay:
                      type: boolean
                    disable_seek:
                      type: boolean
                    disable_player_controls:
                      type: boolean
                    powered_by_gumlet_overlay:
                      type: boolean
                    allow_drm_protected_videos:
                      type: boolean
                    loop:
                      type: boolean
                    player_color:
                      type: string
                    include_seo:
                      type: boolean
                    subtitle_enabled:
                      type: boolean
                    pixel_tags:
                      type: object
                      properties: {}
                    logo_width:
                      type: integer
                      format: int32
                    logo_height:
                      type: integer
                      format: int32
                    dynamic_watermark:
                      type: boolean
                    watermark_font_size:
                      type: integer
                      format: int32
                    watermark_font_color:
                      type: string
                    watermark_bg_color:
                      type: string
                    watermark_interval:
                      type: integer
                      format: int32
                channel_visibility:
                  type: boolean
                  description: If true then playlist will be visible on channel page.
                  default: false
            examples:
              Request Example:
                value:
                  title: Playlist-Title-Updated
                  position: 6
                  description: This is updated description
                  player_config:
                    preload: true
                    autoplay: false
                    disable_seek: true
