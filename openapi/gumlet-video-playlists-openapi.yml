          \ \"player_color\": \"#6658ea\",\n        \"include_seo\": True,\n        \"subtitle_enabled\"\
          : True,\n        \"pixel_tags\": {},\n        \"logo_width\": 51,\n        \"logo_height\":\
          \ 100,\n        \"dynamic_watermark\": False,\n        \"watermark_font_size\": 1,\n       \
          \ \"watermark_font_color\": \"#ff0000\",\n        \"watermark_bg_color\": \"transparent\",\n\
          \        \"watermark_interval\": 1000,\n    },\n    channel_visibility=False,\n)\n\nprint(video_playlist)"
    delete:
