  /video/playlists/{playlist_id}/reorder:
    post:
      summary: Arrange Videos In Playlist
      description: Reorder videos inside a playlist either by moving a single asset to a position or by
        sorting the playlist by title or created date.
      operationId: reorder-asset-playlist
      parameters:
      - name: playlist_id
        in: path
        description: Playlist id.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - asset_id
                - page_number
                - page_size
                - asset_position
                properties:
                  asset_id:
                    type: string
                    description: Asset id to move.
                  page_number:
                    type: integer
                    minimum: 1
                    description: Current playlist page number.
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 200
                    description: Playlist page size used by the caller.
                  asset_position:
                    type: integer
                    minimum: 0
                    description: Zero-based position inside the provided page.
              - type: object
                required:
                - sort_by
                - sort_order
                properties:
                  sort_by:
                    type: string
                    enum:
                    - title
                    - created_at
                  sort_order:
                    type: string
                    enum:
                    - asc
                    - desc
            examples:
              Move Example:
                value:
                  asset_id: 6e82bf783e88be000ab45ed2
                  page_number: 1
                  page_size: 10
                  asset_position: 0
              Sort Example:
                value:
                  sort_by: title
                  sort_order: asc
