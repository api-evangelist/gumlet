openapi: 3.1.0
info:
  title: Gumlet Image Sources API
  version: '1.4'
  description: Image Sources operations of the Gumlet API.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
servers:
- url: https://api.gumlet.com/v1
tags:
- name: Image Sources
paths:
  /image/sources:
    post:
      summary: Create Source
      description: This endpoint allows users to create image source.
      operationId: create-image-source
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - namespace
              - type
              properties:
                namespace:
                  type: string
                  description: unique subdomain associated with the image source
                type:
                  type: string
                  enum:
                  - proxy
                  - webfolder
                  - aws
                  - gcs
                  - dostorage
                  - wasabi
                  - cloudinary
                  - azure
                  - linode
                  - backblaze
                  - cloudflare
                  - zoom
                aws:
                  type: object
                  description: This is a required field if source type is aws.
                  required:
                  - bucket_name
                  - bucket_region
                  - access_key
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    bucket_region:
                      type: string
                    access_key:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                    endpoint:
                      type: string
                proxy:
                  type: object
                  description: This is a required field if source type is proxy.
                  required:
                  - whitelisted_domains
                  properties:
                    whitelisted_domains:
                      type: string
                gcs:
                  type: object
                  description: This is a required field if source type is gcs.
                  required:
                  - bucket_name
                  - service_account_key
                  properties:
                    bucket_name:
                      type: string
                    service_account_key:
                      type: string
                dostorage:
                  type: object
                  description: This is a required field if source type is dostorage.
                  required:
                  - bucket_name
                  - bucket_region
                  - access_key
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    bucket_region:
                      type: string
                    access_key:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                wasabi:
                  type: object
                  description: This is a required field if source type is wasabi.
                  required:
                  - bucket_name
                  - bucket_region
                  - access_key
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    bucket_region:
                      type: string
                    access_key:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                cloudinary:
                  type: object
                  description: This is a required field if source type is cloudinary.
                  required:
                  - host_name
                  - cloud_name
                  properties:
                    host_name:
                      type: string
                    cloud_name:
                      type: string
                azure:
                  type: object
                  description: This is a required field if source type is azure.
                  required:
                  - azure_account_name
                  - azure_container_name
                  - azure_shared_token
                  - azure_path
                  properties:
                    azure_account_name:
                      type: string
                    azure_container_name:
                      type: string
                    azure_shared_token:
                      type: string
                    azure_path:
                      type: string
                linode:
                  type: object
                  description: This is a required field if source type is linode.
                  required:
                  - bucket_name
                  - bucket_region
                  - access_key
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    bucket_region:
                      type: string
                    access_key:
                      type: string
                    secret:
                      type: string
                backblaze:
                  type: object
                  description: This is a required field if source type is backblaze.
                  required:
                  - bucket_name
                  - access_key
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    bucket_region:
                      type: string
                      description: bucket_region or endpoint
                    endpoint:
                      type: string
                      description: bucket_region or endpoint
                    access_key:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                cloudflare:
                  type: object
                  description: This is a required field if source type is cloudflare.
                  required:
                  - bucket_name
                  - access_key
                  - account_id
                  - secret
                  properties:
                    bucket_name:
                      type: string
                    access_key:
                      type: string
                    account_id:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                webfolder:
                  type: object
                  x-stoplight:
                    id: kt4iq0r4ofkar
                  properties:
                    base_url:
                      type: string
                      x-stoplight:
                        id: 8nxga6djly0mz
            examples:
              Request Example:
                value:
                  type: webfolder
                  webfolder:
                    base_url: https://www.google.com
                  namespace: google-demo
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 6a849ee1ed1e919cbba62a7e
                    namespace: google-demo
                    type: webfolder
                    cdn_type: third_party
                    cdn_cache_time: 8640000
                    canonical_url: true
                    browser_cache_time: 8640000
                    is_cloudfront: false
                    created_at: '2026-08-18T18:05:21.565Z'
                    updated_at: '2026-08-18T18:05:21.565Z'
                    webfolder:
                      base_url: https://www.google.com
                    default_params:
                      format: auto
                      compress: 'true'
                    subdomain: google-demo.gumlet.io
                    is_active: true
              schema:
                type: object
                properties:
                  id:
                    type: string
                  namespace:
                    type: string
                  type:
                    type: string
                  cdn_type:
                    type: string
                  cdn_cache_time:
                    type: integer
                  canonical_url:
                    type: boolean
                  browser_cache_time:
                    type: integer
                  is_cloudfront:
                    type: boolean
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  webfolder:
                    type: object
                    properties:
                      base_url:
                        type: string
                  default_params:
                    type: object
                    properties:
                      format:
                        type: string
                      compress:
                        type: string
                  subdomain:
                    type: string
                  is_active:
                    type: boolean
                x-examples:
                  Example 1:
                    id: 6a849ee1ed1e919cbba62a7e
                    namespace: google-demo
                    type: webfolder
                    cdn_type: third_party
                    cdn_cache_time: 8640000
                    canonical_url: true
                    browser_cache_time: 8640000
                    is_cloudfront: false
                    created_at: '2026-08-18T18:05:21.565Z'
                    updated_at: '2026-08-18T18:05:21.565Z'
                    webfolder:
                      base_url: https://www.google.com
                    default_params:
                      format: auto
                      compress: 'true'
                    subdomain: google-demo.gumlet.io
                    is_active: true
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: parameter_missing
                      message: One or more required values are missing.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_missing
                      message:
                        type: string
                        example: One or more required values are missing.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — feature not on plan
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: unauthorised_feature_access
                      message: Your plan doesn't have this feature or you have reached the plan limit.
                        Please upgrade your current plan to access this feature.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: unauthorised_feature_access
                      message:
                        type: string
                        example: Your plan doesn't have this feature or you have reached the plan limit.
                          Please upgrade your current plan to access this feature.
                    required:
                    - code
                    - message
                required:
                - error
        '422':
          $ref: '#/components/responses/ValidationError'
      deprecated: false
      tags:
      - Image Sources
      x-stoplight:
        id: hublbrwwbpzvk
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst imageSource = await client.imageSources.create({\n\
          \  type: 'webfolder',\n  webfolder: { base_url: 'https://www.google.com' },\n  namespace: 'google-demo',\n\
          });\n\nconsole.log(imageSource);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nimage_source = client.image_sources.create(\n    namespace=\"google-demo\"\
          ,\n    type=\"webfolder\",\n    webfolder={\"base_url\": \"https://www.google.com\"},\n)\n\n\
          print(image_source)"
