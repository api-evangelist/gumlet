      description: You can purge cache for any image by using our cache purge API.
      operationId: purge-image-cache
      parameters:
      - name: subdomain
        in: path
        description: Subdomain is same subdomain you created while creating source. If you serve image
          from example.gumlet.com, please enter only 'example' for this parameter.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  description: An array of path of images to purge. It should be provided without any
                    query parameters.
                  items:
                    type: string
            examples:
              Example 1:
                value:
                  paths:
                  - image.jpeg
                  - image2.png
