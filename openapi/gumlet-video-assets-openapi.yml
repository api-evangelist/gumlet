openapi: 3.1.0
info:
  title: Gumlet Video Assets API
  version: '1.4'
  description: Video Assets operations of the Gumlet API.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
servers:
- url: https://api.gumlet.com/v1
tags:
- name: Video Assets
paths:
  /video/assets:
    post:
      summary: Create Asset
      description: An asset refers to media content/video that is processed, stored, and delivered through
        Gumlet. This endpoint creates an asset allowing users to ingest media content into the Gumlet
        system for processing and delivery.
      operationId: create-asset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - workspace_id
              - format
              properties:
                input:
                  type: string
                  description: URL or web address of a file that Gumlet should download to create a new
                    asset.
                profile_id:
                  type: string
                  description: Provide `profile_id` of the previously created video profile. This parameter
                    will override all the parameters (except `input` and `collection_id`) from the video
                    profile.
                format:
                  type: string
                  description: Transcode and deliver the asset in the requested format. The options can
                    be one of `ABR` (HLS + DASH) and `MP4`.
                  enum:
                  - ABR
                  - MP4
                tag:
                  type: array
                  description: Specify a text string or identifier which can identify an asset or bunch
                    of assets later.
                  items:
                    x-stoplight:
                      id: ukzi2mra8hepj
                    type: string
                title:
                  type: string
                  description: Specify a text string or identifier which can be used for filtering or
                    searching the asset.
                description:
                  type: string
                  description: Attach some textual data with the asset. This field is neither searchable
                    nor filterable.
                metadata:
                  type: object
                  description: 'Add your metadata you want to associate with this asset.<br/> Example:
                    <br/> <code>  {  "internal_video_id" : "123Abc"  }  </code>'
                  additionalProperties: {}
                  properties: {}
                  x-apidog-orders: []
                width:
                  type: string
                  description: Resize video with the given width. Can be an absolute value in pixels or
                    a percentage value with the `%` suffix. Specified values greater than the original
                    asset width will be ignored. Applicable only when specified format is `MP4`.
                height:
                  type: string
                  description: Resize video with the given height. Can be an absolute value in pixels
                    or a percentage value with the `%` suffix. Specified values greater than the original
                    asset height will be ignored. Applicable only when specified format is `MP4`.
                resolution:
                  type: string
                  description: 'Required resolutions of the transformed asset in case of HLS or MPEG-DASH
                    delivery format. Can be a comma-separated string out of the following values: `240p`,
                    `360p`, `480p`, `540p`, `720p`, and `1080p`. Resized rendition will retain the input
                    aspect ratio.'
                crop:
                  type: object
                  description: This transformation can be used to crop the video by defining a rectangular
                    area within the dimensions of the output video.
                  required:
                  - width
                  - height
                  properties:
                    horizontal_margin:
                      type: string
                      description: 'This parameter defines the horizontal coordinate value of the upper-left
                        corner of the cropping area. Values can be an absolute number of pixels or a percentage
                        value relative to the video width. **Default: `0`**'
                    vertical_margin:
                      type: string
                      description: 'This parameter defines the vertical coordinate value of the upper-left
                        corner of the cropping area. Values can be an absolute number of pixels or a percentage
                        value relative to the video height. **Default: `0`**'
                    width:
                      type: string
                      description: Width of the cropping area in pixels.
                    height:
                      type: string
                      description: Height of the cropping area in pixels.
                  x-apidog-orders:
                  - horizontal_margin
                  - vertical_margin
                  - width
                  - height
                pad:
                  type: object
                  description: This transformation can be used to add padding to the video.
                  properties:
                    top:
                      type: string
                      description: 'Width of padding on the top side. Values can be an absolute number
                        of pixels or a percentage value relative to the video height. **Default: `%5`**'
                    left:
                      type: string
                      description: 'Width of padding on the left side. Values can be an absolute number
                        of pixels or a percentage value relative to the video width. **Default: `0`**'
                    bottom:
                      type: string
                      description: 'Width of padding on the bottom side. Values can be an absolute number
                        of pixels or a percentage value relative to the video height. **Default: `%5`**'
                    right:
                      type: string
                      description: 'Width of padding on the right side. Values can be an absolute number
                        of pixels or a percentage value relative to the video width. **Default: `0`**'
                    color:
                      type: string
                      description: 'Color of padding area. **Default: `black`**'
                  x-apidog-orders:
                  - top
                  - left
                  - bottom
                  - right
                  - color
                trim:
                  type: object
                  description: Trim transformation can be used to trim videos based on time duration.
                  required:
                  - start_offset
                  - end_offset
                  properties:
                    start_offset:
                      type: number
                      description: Start offset in number of seconds or in `HH:MM:SS` format.
                      format: float
                    end_offset:
                      type: number
                      description: End offset in number of seconds or in `HH:MM:SS` format.
                      format: float
                    duration:
                      type: number
                      description: Duration can be used in conjunction with `start_offset` parameter,
                        can be specified in number of seconds.
                      format: float
                  x-apidog-orders:
                  - start_offset
                  - end_offset
                  - duration
                image_overlay:
                  type: object
                  description: Image overlay can be used to brand a video or add a visual label in the
                    form of an image.
                  required:
                  - url
                  properties:
                    url:
                      type: string
                      description: This is the required parameter for image overlay; it can be a URL to
                        an image that needs to be overlaid.
                    horizontal_margin:
                      type: string
                      description: 'This parameter defines the horizontal coordinate value of the corner
                        (determined by `horizontal_align`) of the overlay area. Values can be an absolute
                        number of pixels or a percentage value relative to the video width. **Default:
                        `0`**'
                    vertical_margin:
                      type: string
                      description: 'This parameter defines the vertical coordinate value of the corner
                        (determined by `vertical_align`) of the overlay area. Values can be an absolute
                        number of pixels or a percentage value relative to the video height. **Default:
                        `0`**'
                    horizontal_align:
                      type: string
                      description: 'This parameter specifies the horizontal alignment of the overlaid
                        image and can be either `left` or `right`. **Default: `right`**'
                    vertical_align:
                      type: string
                      description: 'This parameter specifies the vertical alignment of the overlaid image
                        and can be either `top` or `bottom`. **Default: `bottom`**'
                    width:
                      type: string
                      description: 'Width of the overlaid image. **Default: `image width`**'
                    height:
                      type: string
                      description: 'Height of the overlaid image. **Default: `image height`**'
                  x-apidog-orders:
                  - url
                  - horizontal_margin
                  - vertical_margin
                  - horizontal_align
                  - vertical_align
                  - width
                  - height
                text_overlay:
                  type: object
                  description: Text overlay can be used to brand a video or add a label in the form of
                    text.
                  required:
                  - text
                  properties:
                    text:
                      type: string
                      description: Text to be overlaid on video.
                    horizontal_align:
                      type: string
                      description: 'This parameter specifies the horizontal alignment of the overlaid
                        text and can be either `left` or `right`. **Default: `right`**'
                    vertical_align:
                      type: string
                      description: 'This parameter specifies the vertical alignment of the overlaid text
                        and can be either `top` or `bottom`. **Default: `bottom`**'
                    horizontal_margin:
                      type: string
                      description: 'This parameter defines the horizontal coordinate value of the corner
                        (determined by `horizontal_align`) of the overlay area. Values can be an absolute
                        number of pixels relative to the video width. **Default: `0`**'
                    vertical_margin:
                      type: string
                      description: 'This parameter defines the vertical coordinate value of the corner
                        (determined by vertical_align) of the overlay area. Values can be an absolute
                        number of pixels relative to the video height. **Default: `0`**'
                    color:
                      type: string
                      description: 'Font color for text. **Default: `black`**'
                    font:
                      type: string
                      description: 'Font family type for text. **Default: `sans`**'
                    font_size:
                      type: string
                      description: 'Font size in pixels. **Default: `16`**'
                    opacity:
                      type: string
                      description: 'Overlay text opacity can be specified with opacity parameter where
                        value can be between `0` and `100` where `0` is considered completely transparent
                        and `100` is considered completely opaque. **Default: `100`**'
                    box:
                      type: boolean
                      description: 'This parameter allows drawing a rectangular box over the overlaid
                        text. **Default: `false`**'
                    box_color:
                      type: string
                      description: 'Box color can be specified with this parameter. **Default: `white`**'
                    box_opacity:
                      type: string
                      description: 'Box opacity can be specified with this parameter. **Default: `100`**'
                    box_border:
                      type: string
                      description: 'Padding between the box border and the text can be specified with
                        this parameter in pixels. **Default: `0`**'
                  x-apidog-orders:
                  - text
                  - horizontal_align
                  - vertical_align
                  - horizontal_margin
                  - vertical_margin
                  - color
                  - font
                  - font_size
                  - opacity
                  - box
                  - box_color
                  - box_opacity
                  - box_border
                animated_gif:
                  type: object
                  description: Create an animated GIF from the video.
                  properties:
                    start_offset:
                      type: string
                      description: 'The time (in seconds or `HH:MM:SS` format) of the video timeline where
                        the animated gif should begin. **Default: `0`**'
                    end_offset:
                      type: string
                      description: The time (in seconds or `HH:MM:SS` format) of the video timeline where
                        the GIF ends. Defaults to `10` seconds after the start_offset. Maximum duration
                        of GIF is limited to `10` seconds.
                    width:
                      type: string
                      description: The width in pixels (or in percentage value of asset width) of the
                        animated GIF. Max width is `640px`.
                    height:
                      type: string
                      description: The height in pixels (or in percentage value of asset height) of the
                        animated GIF. Max height is `640px`.
                    fps:
                      type: string
                      description: The frame rate of the generated GIF. Defaults to `15` fps. Max `30`
                        fps.
                  x-apidog-orders:
                  - start_offset
                  - end_offset
                  - width
                  - height
                  - fps
                additional_tracks:
                  type: array
                  description: Add additional Audio / Subtitle tracks to Gumlet for transcoding and delivery
                    along with video asset track.
                  items:
                    type: object
                    required:
                    - url
                    - type
                    - language_code
                    properties:
                      url:
                        type: string
                        description: URL or web address of a file that Gumlet should download to add a
                          stream.
                      type:
                        type: string
                        description: Type of additional track. Value can be either audio or subtitle.
                      language_code:
                        type: string
                        description: The language code value represents BCP 47 specification compliant
                          value. For example, en for English.
                      name:
                        type: string
                        description: The name of the track containing a human-readable description.
                    x-apidog-orders:
                    - url
                    - type
                    - language_code
                    - name
                generate_subtitles:
                  type: object
                  description: Gumlet allows you to generate subtitles from the audio stream (use <a href='https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes'>
                    ISO 639-1 </a> Language Codes)
                  properties:
                    audio_language:
                      type: string
                      description: Language code for native language of the audio.
                    subtitle_languages:
                      type: string
                      description: Comma separated string of language codes for which subtitle needs to
                        be generated. Maximum four language codes are allowed.
                  x-apidog-orders:
                  - audio_language
                  - subtitle_languages
                mp4_access:
                  type: boolean
                  description: 'Creates `MP4` version for download purpose in case of `MPEG-DASH` or `HLS`
                    delivery format. **Default: `false`**'
                per_title_encoding:
                  type: boolean
                  description: 'Gumlet analyzes each input video on a wide range of visual aspects. Based
                    on the analysis, it chooses a unique set of transcoding options for processing the
                    video. This ensures that the output video is of optimal size and best quality. **Default:
                    `true`**'
                process_low_resolution_input:
                  type: boolean
                  description: 'Currently, the minimum supported frame size is `57600` (`240x240`) pixels
                    for `HLS/DASH` and `21025` (`145x145`) pixels for `MP4` format. However, enabling
                    this flag will allow Gumlet to simply put your video asset into the specified delivery
                    format without transcoding and optimization. Enabling this flag will cause any kind
                    of specified video transformation to be ignored if you input video asset frame size
                    is lower than the minimum supported frame size for the specified format. **Default:
                    `false`**'
                audio_only:
                  type: boolean
                  description: 'This flag allows Gumlet to transcode and deliver audio-only in the specified
                    format. In this case, video transformation and thumbnails/animated GIFs would not
                    be created. **Default: `false`**'
                enable_drm:
                  type: boolean
                  description: Enable DRM encryption for transcoded videos. Gumlet supports Widevine and
                    FairPlay DRMs.
                call_to_actions:
                  type: array
                  description: A CTA is an explicit prompt within the video content encouraging viewers
                    to take a particular action.
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      url:
                        type: string
                      start_time:
                        type: integer
                        format: int32
                      end_time:
                        type: integer
                        format: int32
                      font_color:
                        type: string
                        description: hex value of color
                      background_color:
                        type: string
                        description: hex code of color
                      position_from_top:
                        type: integer
                        description: number of pixels from top
                        format: int32
                      position_from_right:
                        type: integer
                        description: number of pixels from right
                        format: int32
                    x-apidog-orders:
                    - text
                    - url
                    - start_time
                    - end_time
                    - font_color
                    - background_color
                    - position_from_top
                    - position_from_right
                playlist_id:
                  type: string
                  description: Add this asset to a playlist.
                folder:
                  type: string
                  description: Add this asset to an existing folder by `folder_id`.
                workspace_id:
                  type: string
                  description: Gumlet video workspace id.
              x-apidog-orders:
              - input
              - workspace_id
              - profile_id
              - format
              - tag
              - title
              - description
              - metadata
              - width
              - height
              - resolution
              - crop
              - pad
              - trim
              - image_overlay
              - text_overlay
              - animated_gif
              - additional_tracks
              - generate_subtitles
              - mp4_access
              - per_title_encoding
              - process_low_resolution_input
              - audio_only
              - enable_drm
              - call_to_actions
              - playlist_id
              - folder
            examples:
              Simple Example:
                value:
                  format: ABR
                  workspace_id: <your workspace id>
                  title: Example Title
                  input: http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8
              Detailed Example:
                value:
                  format: ABR
                  workspace_id: 646df1c9173a4a2fcac180b4
                  input: http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8
                  description: some description
                  tag:
                  - ball
                  profile_id: 646df1c9173a4a2fcac180b7
                  cluster_type: prod
                  playlist_id: 6597acd5ed6f26a9c5ca9633
                  metadata:
                    headermeta: metavalue
                  call_to_actions:
                  - start_time: 1
                    end_time: 90
                    text: some test
                    url: https://some-url.com
                    position_from_top: 11
                    position_from_right: 23
                    border_radius: '11'
                    font_color: '#000001'
                    background_color: '#ffffff'
                  folder: 697375fbfa2d1037283140e4
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    asset_id: 65b168a6e99b77f116c0e488
                    progress: 0
                    created_at: 1706125479006
                    updated_at: 1706125479006
                    status: pre-queued
                    tag:
                    - ball
                    source_id: 646df1c9173a4a2fcac180b4
                    collection_id: 646df1c9173a4a2fcac180b4
                    input:
                      transformations:
                        format: hls
                        resolution:
                        - 360p
                        - 480p
                        - 540p
                        - 720p
                        - 1080p
                        audio_codec:
                        - aac
                        video_codec:
                        - libx264
                        thumbnail:
                        - auto
                        thumbnail_format: png
                        mp4_access: false
                        per_title_encoding: false
                      profile_id: 646df1c9173a4a2fcac180b7
                      title: bipbopall
                      description: some description
                      metadata:
                        headermeta: metavalue
                      source_url: http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8
                      call_to_actions:
                      - start_time: 1
                        end_time: 90
                        text: some test
                        url: https://some-url.com
                        position_from_top: 11
                        position_from_right: 23
                        border_radius: 11
                        font_color: '#000001'
                        background_color: '#ffffff'
                        html_target: _blank
                    output:
                      format: hls
                      status_url: https://api.gumlet.com/v1/video/assets/65b168a6e99b77f116c0e488
                      playback_url: https://video.gumlet.io/646df1c9173a4a2fcac180b4/65b168a6e99b77f116c0e488/main.m3u8
                      thumbnail_url:
                      - https://video.gumlet.io/646df1c9173a4a2fcac180b4/65b168a6e99b77f116c0e488/thumbnail-1-0.png?v=1706125479006
                    playlists:
                    - 6597acd5ed6f26a9c5ca9633
              schema:
                type: object
                properties:
                  asset_id:
                    type: string
                    example: 65b168a6e99b77f116c0e488
                  progress:
                    type: integer
                    example: 0
                    default: 0
                  created_at:
                    type: integer
                    example: 1706125479006
                    default: 0
                  updated_at:
                    type: integer
                    example: 1706125479006
                    default: 0
                  status:
                    type: string
                    example: pre-queued
                  tag:
                    type: array
                    items:
                      type: string
                      example: ball
                  source_id:
                    type: string
                    example: 646df1c9173a4a2fcac180b4
                  collection_id:
                    type: string
                    example: 646df1c9173a4a2fcac180b4
                  input:
                    type: object
                    properties:
                      transformations:
                        type: object
                        properties:
                          format:
                            type: string
                            example: hls
                          resolution:
                            type: array
                            items:
                              type: string
                              example: 360p
                          audio_codec:
                            type: array
                            items:
                              type: string
                              example: aac
                          video_codec:
                            type: array
                            items:
                              type: string
                              example: libx264
                          thumbnail:
                            type: array
                            items:
                              type: string
                              example: auto
                          thumbnail_format:
                            type: string
                            example: png
                          mp4_access:
                            type: boolean
                            example: false
                            default: true
                          per_title_encoding:
                            type: boolean
                            example: false
                            default: true
                      profile_id:
                        type: string
                        example: 646df1c9173a4a2fcac180b7
                      title:
                        type: string
                        example: bipbopall
                      description:
                        type: string
                        example: some description
                      metadata:
                        type: object
                        properties:
                          headermeta:
                            type: string
                            example: metavalue
                      source_url:
                        type: string
                        example: http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8
                      call_to_actions:
                        type: array
                        items:
                          type: object
                          properties:
                            start_time:
                              type: integer
                              example: 1
                              default: 0
                            end_time:
                              type: integer
                              example: 90
                              default: 0
                            text:
                              type: string
                              example: some test
                            url:
                              type: string
                              example: https://some-url.com
                            position_from_top:
                              type: integer
                              example: 11
                              default: 0
                            position_from_right:
                              type: integer
                              example: 23
                              default: 0
                            border_radius:
                              type: integer
                              example: 11
                              default: 0
                            font_color:
                              type: string
                              example: '#000001'
                            background_color:
                              type: string
                              example: '#ffffff'
                            html_target:
                              type: string
                              example: _blank
                  output:
                    type: object
                    properties:
                      format:
                        type: string
                        example: hls
                      status_url:
                        type: string
                        example: https://api.gumlet.com/v1/video/assets/65b168a6e99b77f116c0e488
                      playback_url:
                        type: string
                        example: https://video.gumlet.io/646df1c9173a4a2fcac180b4/65b168a6e99b77f116c0e488/main.m3u8
                      thumbnail_url:
                        type: array
                        items:
                          type: string
                          example: https://video.gumlet.io/646df1c9173a4a2fcac180b4/65b168a6e99b77f116c0e488/thumbnail-1-0.png?v=1706125479006
                  playlists:
                    type: array
                    items:
                      type: string
                      example: 6597acd5ed6f26a9c5ca9633
        '400':
          description: Bad Request — missing or invalid parameters
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: source_not_found
                      message: Could not find any video source with specified source ID.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: source_not_found
                      message:
                        type: string
                        example: Could not find any video source with specified source ID.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Payment Required — unpaid invoices
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: payment_pending
                      message: Please clear your pending invoices to resume your services.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: payment_pending
                      message:
                        type: string
                        example: Please clear your pending invoices to resume your services.
                    required:
                    - code
                    - message
                required:
                - error
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: false
      tags:
      - Video Assets
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst videoAsset = await client.videoAssets.create({\n\
          \  format: 'ABR',\n  workspace_id: '<your workspace id>',\n  title: 'Example Title',\n  input:\
          \ 'http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8',\n});\n\nconsole.log(videoAsset);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nvideo_asset = client.video_assets.create(\n    input=\"http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8\"\
          ,\n    format=\"ABR\",\n    title=\"Example Title\",\n    workspace_id=\"<your workspace id>\"\
          ,\n)\n\nprint(video_asset)"
  /video/assets/upload:
    post:
      summary: Create Asset Direct Upload
      description: This endpoint creates a video asset allowing upload of a video from the local file
        system and ingest media content into the Gumlet system for processing and delivery. Body parameters
        are the same as the Create Asset body parameters except for the `input` parameter, which this
        endpoint does not take. A successful response will be returned with `upload_url` field. You can
        make `PUT` request to that URL to upload video. To upload video using `upload_url` refer to [this](https://docs.gumlet.com/docs/direct-upload#2-use-the-url-to-upload-a-file).
      operationId: create-asset-direct-upload
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - collection_id
              properties:
                collection_id:
                  type: string
                  description: Gumlet video workspace id.
                profile_id:
                  type: string
                  description: Provide `profile_id` of the previously created video profile. This parameter
                    will override all the parameters (except `input` and `collection_id`) from the video
                    profile.
                format:
                  type: string
                  description: Transcode and deliver the asset in the requested format. The options can
