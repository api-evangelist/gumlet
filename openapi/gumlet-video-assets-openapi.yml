                      id: ukzi2mra8hepj
                    type: string
                title:
                  type: string
                  description: Specify a text string or identifier which can be used for filtering or
                    searching the asset.
                description:
                  type: string
                  description: Attach some textual data with the asset. This field is neither searchable
                    nor filterable.
                metadata:
                  type: object
                  description: 'Add your metadata you want to associate with this asset.<br/> Example:
