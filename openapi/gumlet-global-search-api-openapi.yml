openapi: 3.2.0
info:
  title: Gumlet Global Search API
  version: '1.4'
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
  x-refined-note:
  - x-scalar-sdk-installation differs across the merged source definitions and was not carried
  description: 'Operations tagged Global Search across 2 of this provider''s published API definitions: gumlet-openapi.json, gumlet-global-search-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.gumlet.com/v1
security:
- API_KEY: []
tags:
- name: Global Search
  description: Search all video assets / playlists / folders etc across workspaces.
paths:
  /entities/global-search:
    get:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  all_folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Folder ID
                        created_at:
                          type: integer
                          format: int64
                          description: Created at timestamp in milliseconds since epoch
                        updated_at:
                          type: integer
                          format: int64
                          description: Updated at timestamp in milliseconds since epoch
                        workspace_id:
                          type: string
                          description: Workspace ID in which the folder resides
                        highlight:
                          type: array
                          items:
                            type: object
                            properties:
                              score:
                                type: number
                                description: Search ranking score
                              path:
                                type: string
                                description: Which field to highlight
                              texts:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    value:
                                      type: string
                                      description: The word to highlight or not
                                    type:
                                      type: string
                                      enum:
                                      - hit
                                      - text
                                      x-apidog-enum:
                                      - value: hit
                                        name: ''
                                        description: ''
                                      - value: text
                                        name: ''
                                        description: ''
                                      description: Whether this word needs highlight
                                  x-apidog-orders:
                                  - value
                                  - type
                                  required:
                                  - value
                                  - type
                            x-apidog-orders:
                            - score
                            - path
                            - texts
                            required:
                            - score
                            - path
                            - texts
                      x-apidog-orders:
                      - id
                      - created_at
                      - updated_at
                      - workspace_id
                      - highlight
                      required:
                      - id
                      - created_at
                      - updated_at
                      - workspace_id
                      - highlight
                    description: Result array of all folders
                  all_assets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Asset ID
                        title:
                          type: string
                          description: Asset Title
                        tags:
                          type: array
                          items:
                            type: string
                          description: List of tags applied to this asset
                        workspace_id:
                          type: string
                          description: Workspace ID on in which this asset resides
                        created_at:
                          type: integer
                          description: Created at timestamp in milliseconds since epoch
                          format: int64
                        updated_at:
                          type: integer
                          description: Updated at timestamp in milliseconds since epoch
                          format: int64
                        highlight:
                          type: array
                          items:
                            type: object
                            properties:
                              score:
                                type: number
                                description: Search ranking score
                              path:
                                type: string
                                description: Which field to highlight
                              texts:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    value:
                                      type: string
                                      description: The word to highlight or not
                                    type:
                                      type: string
                                      enum:
                                      - hit
                                      - text
                                      x-apidog-enum:
                                      - value: hit
                                        name: ''
                                        description: ''
                                      - value: text
                                        name: ''
                                        description: ''
                                      description: Whether this word needs highlight
                                  x-apidog-orders:
                                  - value
                                  - type
                                  required:
                                  - value
                                  - type
                            x-apidog-orders:
                            - score
                            - path
                            - texts
                            required:
                            - score
                            - path
                            - texts
                      x-apidog-orders:
                      - id
                      - title
                      - tags
                      - workspace_id
                      - created_at
                      - updated_at
                      - highlight
                      required:
                      - id
                      - title
                      - tags
                      - workspace_id
                      - created_at
                      - updated_at
                      - highlight
                    description: Result array of all assets
                  all_playlists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Playlist ID
                        title:
                          type: string
                          description: Playlist title
                        description:
                          type: string
                          description: Playlist description
                        created_at:
                          type: integer
                          description: Created at timestamp in milliseconds since epoch
                          format: int64
                        updated_at:
                          type: integer
                          description: Updated at timestamp in milliseconds since epoch
                          format: int64
                        workspace_id:
                          type: string
                          description: Workspace ID on in which this playlist resides
                        highlight:
                          type: array
                          items:
                            type: object
                            properties:
                              score:
