                - all_assets
                - all_playlists
                - all_channels
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: parameter_missing
                      message: One or more required values are missing.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_missing
                      message:
                        type: string
                        example: One or more required values are missing.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: Global Search
      tags:
      - Global Search
      operationId: global-search
      description: Search all video assets / playlists / folders etc across workspaces.
      parameters:
      - in: query
        name: search_query
        schema:
          type: string
        required: true
        description: Search query term
      - in: query
        name: collection_id
        schema:
          type: string
        description: Workspace ID if you want to limit search to a specific workspace
      - in: query
        name: size
        schema:
          type: integer
          default: 20
        description: Number of results to return
      - in: query
        name: assets_offset
        schema:
          type: integer
          default: 0
        description: Offset for assets
      - in: query
        name: folders_offset
        schema:
          type: integer
          default: 0
        description: Offset for folders
      - in: query
        name: playlists_offset
        schema:
          type: integer
          default: 0
        description: Offset for playlists
      - in: query
        name: channels_offset
        schema:
          type: integer
          default: 0
        description: Offset for channels
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'], // defaults to the API_KEY env var\n});\n\nconst globalSearch = await client.globalSearch.search({\n  search_query: 'searchQuery',\n  size: 20,\n  assets_offset: 0,\n  folders_offset: 0,\n  playlists_offset: 0,\n  channels_offset: 0,\n});\n\nconsole.log(globalSearch);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"API_KEY\"),\n)\n\nglobal_search = client.global_search.search(\n    search_query=\"search_query\",\n    size=20,\n    assets_offset=0,\n    folders_offset=0,\n    playlists_offset=0,\n    channels_offset=0,\n)\n\nprint(global_search)"
    servers:
    - url: https://api.gumlet.com/v1
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            param:
              type: string
              description: Optional parameter name related to the error
  responses:
    Forbidden:
      description: Forbidden — unpaid account or insufficient role permissions
      content:
        application/json:
          examples:
            Result:
              value:
                error:
                  code: unauthorized
                  message: You don't have access to this feature. Please contact your organization owner.
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid API key / bearer token
      content:
        application/json:
          examples:
            Result:
              value:
                error:
                  code: invalid_api_key
                  message: API key supplied with request is invalid
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    API_KEY:
      type: http
      scheme: bearer
