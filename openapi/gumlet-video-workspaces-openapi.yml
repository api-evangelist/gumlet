                    bucket_region:
                      type: string
                    access_key:
                      type: string
                    secret:
                      type: string
                    base_path:
                      type: string
                    endpoint:
                      type: string
                proxy:
                  type: object
                  description: This is a required field if workspace type is proxy.
                  required:
                  - whitelisted_domains
                  properties:
                    whitelisted_domains:
                      type: string
                gcs:
