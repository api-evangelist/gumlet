    post:
      summary: Create Workspace
      description: Video workspaces are top-level entities in Gumlet. You can use them to organize videos
        for different teams/departments or use cases.
      operationId: create-workspace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                  description: Specify a text string or identifier for the workspace.
                type:
                  type: string
                  description: Video workspaces are top-level entities in Gumlet. You can use them to
                    organize videos for different teams/departments or use cases.
                  default: direct-upload
                  enum:
                  - proxy
                  - direct-upload
                  - webfolder
                  - aws
                  - gcs
                  - dostorage
                  - wasabi
                  - cloudinary
                  - azure
                  - linode
                  - backblaze
                  - cloudflare
                  - zoom
                default_profile_id:
                  type: string
                  description: Gumlet provides the functionality of creating multiple video assets using
                    the same set of parameters.
                insight_property_id:
                  type: string
                  description: The five to ten character unique identifier of the Gumlet Insight Property
                    available on the dashboard.
