                  id:
                    type: string
                    example: 67e4f01d403562dbea6542d4
                  name:
                    type: string
                    example: Course Assets
                  video_source_id:
                    type: string
                    example: 67e4ece9403562dbea65425f
                  parent_id:
                    type:
                    - string
                    - 'null'
                    example: null
