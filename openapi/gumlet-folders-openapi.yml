                    type: array
                    items:
                      type: string
                      example: 67e4f01d403562dbea6542d4
                  path_names:
                    type: array
                    items:
                      type: string
                      example: Course Assets
                  depth:
                    type: integer
                    example: 0
                    default: 0
                  subdirectory_count:
                    type: integer
                    example: 2
                    default: 0
                  asset_count:
                    type: integer
                    example: 12
                    default: 0
                  created_at:
                    type: string
                    example: '2026-03-18T10:00:00.000Z'
                  updated_at:
                    type: string
                    example: '2026-03-18T10:15:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: invalid_folder_id
                      message: Folder ID is invalid.
              schema:
                type: object
