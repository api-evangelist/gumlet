openapi: 3.1.0
info:
  title: Gumlet Folders API
  version: '1.4'
  description: Folders operations of the Gumlet API.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
  termsOfService: https://www.gumlet.com/terms/
servers:
- url: https://api.gumlet.com/v1
tags:
- name: Folders
paths:
  /video/workspaces/{workspace_id}/folders:
    post:
      summary: Create Folder
      description: Create a folder inside a video workspace. Optionally provide `parent_id` to create
        a nested folder.
      operationId: create-folder
      parameters:
      - name: workspace_id
        in: path
        description: Video workspace id.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Folder name.
                parent_id:
                  type:
                  - string
                  - 'null'
                  description: Parent folder id. Send `null` or omit it to create a root-level folder.
            examples:
              Request Example:
                value:
                  name: Course Assets
                  parent_id: null
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 67e4f01d403562dbea6542d4
                    name: Course Assets
                    video_source_id: 67e4ece9403562dbea65425f
                    parent_id: null
                    path: []
                    path_names: []
                    depth: 0
                    subdirectory_count: 0
                    asset_count: 0
                    created_at: '2026-03-18T10:00:00.000Z'
                    updated_at: '2026-03-18T10:00:00.000Z'
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 67e4f01d403562dbea6542d4
                  name:
                    type: string
                    example: Course Assets
                  video_source_id:
                    type: string
                    example: 67e4ece9403562dbea65425f
                  parent_id:
                    type:
                    - string
                    - 'null'
                    example: null
                  path:
                    type: array
                    items:
                      type: string
                      example: 67e4f01d403562dbea6542d4
                  path_names:
                    type: array
                    items:
                      type: string
                      example: Course Assets
                  depth:
                    type: integer
                    example: 0
                    default: 0
                  subdirectory_count:
                    type: integer
                    example: 2
                    default: 0
                  asset_count:
                    type: integer
                    example: 12
                    default: 0
                  created_at:
                    type: string
                    example: '2026-03-18T10:00:00.000Z'
                  updated_at:
                    type: string
                    example: '2026-03-18T10:15:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: folder_name_required
                      message: Folder name is required.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: folder_name_required
                      message:
                        type: string
                        example: Folder name is required.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      deprecated: false
      tags:
      - Folders
      x-stoplight:
        id: s0ytspywrm8jb
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst folder = await client.folders.create('workspaceId',\
          \ { name: 'Course Assets', parent_id: null });\n\nconsole.log(folder);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nfolder = client.folders.create(\n    workspace_id=\"workspaceId\",\n    name=\"\
          Course Assets\",\n    parent_id=\"\",\n)\n\nprint(folder)"
    get:
      summary: List Folders
      description: List folders for a video workspace. Use `parent_id` to list only folders inside a specific
        parent folder.
      operationId: list-folders
      parameters:
      - name: workspace_id
        in: path
        description: Video workspace id.
        schema:
          type: string
        required: true
      - name: parent_id
        in: query
        description: Parent folder id. Send `null` to list root folders.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - id: 67e4f01d403562dbea6542d4
                    name: Course Assets
                    video_source_id: 67e4ece9403562dbea65425f
                    parent_id: null
                    path: []
                    path_names: []
                    depth: 0
                    subdirectory_count: 2
                    asset_count: 12
                    created_at: '2026-03-18T10:00:00.000Z'
                    updated_at: '2026-03-18T10:15:00.000Z'
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 67e4f01d403562dbea6542d4
                    name:
                      type: string
                      example: Course Assets
                    video_source_id:
                      type: string
                      example: 67e4ece9403562dbea65425f
                    parent_id:
                      type:
                      - string
                      - 'null'
                      example: null
                    path:
                      type: array
                      items:
                        type: string
                        example: 67e4f01d403562dbea6542d4
                    path_names:
                      type: array
                      items:
                        type: string
                        example: Course Assets
                    depth:
                      type: integer
                      example: 0
                      default: 0
                    subdirectory_count:
                      type: integer
                      example: 2
                      default: 0
                    asset_count:
                      type: integer
                      example: 12
                      default: 0
                    created_at:
                      type: string
                      example: '2026-03-18T10:00:00.000Z'
                    updated_at:
                      type: string
                      example: '2026-03-18T10:15:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      code: invalid_parent_id
                      message: Parent folder ID is invalid.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalid_parent_id
                      message:
                        type: string
                        example: Parent folder ID is invalid.
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: false
      tags:
      - Folders
      x-stoplight:
        id: 6p3tyspj1nvn7
      x-codeSamples:
      - label: TypeScript
        lang: TypeScript
        source: "import Gumlet from '@gumlet/nodejs-sdk';\n\nconst client = new Gumlet({\n  apiKey: process.env['API_KEY'],\
          \ // defaults to the API_KEY env var\n});\n\nconst folder = await client.folders.list('workspaceId');\n\
          \nconsole.log(folder);"
      - label: Python
        lang: Python
        source: "import os\n\nfrom gumlet import Gumlet\n\nclient = Gumlet(\n    api_key=os.environ.get(\"\
          API_KEY\"),\n)\n\nfolder = client.folders.list(\n    workspace_id=\"workspaceId\",\n)\n\nprint(folder)"
