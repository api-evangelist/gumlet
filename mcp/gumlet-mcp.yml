- name: list_sdks
  description: List official Gumlet client SDKs so agents can discover them. Returns the Python package
    on PyPI (gumlet) and the Node.js package on npm (@gumlet/nodejs-sdk), with install commands and registry
    URLs. Use this when the user wants to integrate Gumlet in application code. Do not use this to call
    the live Gumlet API; use the API tools instead.
- name: get_sdk
  description: 'Get install commands and a usage snippet for an official Gumlet SDK. Pass language=python
    for https://pypi.org/project/gumlet/ or language=nodejs for https://www.npmjs.com/package/@gumlet/nodejs-sdk.
    Aliases: py, node, js, ts, javascript, typescript, npm, pypi.'
- name: create_asset
  description: An asset refers to media content/video that is processed, stored, and delivered through
    Gumlet. This endpoint creates an asset allowing users to ingest media content into the Gumlet system
    for processing and delivery.
- name: create_asset_direct_upload
  description: This endpoint creates a video asset allowing upload of a video from the local file system
    and ingest media content into the Gumlet system for processing and delivery. Body parameters are the
    same as the Create Asset body parameters except for the `input` parameter, which this endpoint does
    not take. A successful response will be returned with `upload_url` field. You can make `PUT` request
    to that URL to upload video. To upload video using `upload_url` refer to [this](https://docs.gumlet.com/docs/direct-upload#2-use-the-url-to-upload-a-file).
- name: get_asset_details
  description: This endpoint retrieves the details of an asset that has previously been created.
- name: delete_asset
  description: This endpoint removes an asset given its unique asset id. The asset will be removed from
    storage as well, associated URLs will be inaccessible.
- name: update_asset
  description: This endpoint allows users to update video asset that has previously been created.
- name: thumbnail_select
  description: Select frame from video to use as thumbnail.
- name: thumbnail_upload
  description: 'Use any image file to use as thumbnail. Once you use the API, you will get `upload_url`
    in the response, and that can be used to upload the image file.


    Here is the sample curl request.


    ```bash

    curl --location --request PUT ''<upload_url>'' \

    --data ''<YOUR_FILE_PATH>''

    ```'
- name: upload_subtitles
  description: Upload `.srt` or `.vtt` file to the video asset. The response of this API call gives `upload_url`
    for each language specified. You need to send a `PUT` request of the subtitle files to those URLs.
    Once that's done, you need to call the subtitle upload complete API. Only after that, Gumlet will
    add subtitles to asset.
- name: complete_subtitle_upload
  description: "This API must be called after adding subtitles; the add subtitle call gives you URLs to\
    \ upload, and you complete a `PUT` request to those URLs. \nOnce that is done, calling this initiates\
    \ the process to actually add the subtitle to the video."
- name: asset_audio_upload
  description: "Add any audio file to the video asset. \nThe response of this API call gives `upload_url`\
    \ for each language specified. You need to send a `PUT` request of the audio files to those URLs.\
    \ Once that's done, you need to call the audio upload complete API. Only after that will Gumlet add\
    \ audio to the asset."
- name: complete_audio_upload
  description: "This API must be called after adding audio(s); The add audio call gives you URLs to upload,\
    \ and you complete a `PUT` request to those URLs. \nOnce that is done, calling this initiates the\
    \ process to actually add the subtitle to the video."
