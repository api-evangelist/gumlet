asyncapi: 3.0.0
info:
  title: Gumlet Webhooks
  version: 1.0.0
  description: Asynchronous webhook events Gumlet POSTs to your configured endpoint for video and live-stream
    lifecycle changes. Configure via the org/webhooks API or the dashboard. An optional secret token is
    echoed back in the x-gumlet-token header for verification; non-2xx deliveries are retried for 24 hours
    with ~30 minutes between attempts.
  contact:
    name: Gumlet Support Team
    url: https://www.gumlet.com/contact/
    email: support@gumlet.com
defaultContentType: application/json
channels:
  webhooks:
    address: '{your_webhook_url}'
    title: Configured webhook endpoint
    parameters:
      your_webhook_url:
        description: The HTTPS endpoint you register with create-webhook (POST /org/webhooks).
    messages:
      video_status_created:
        $ref: '#/components/messages/video_status_created'
      video_status_stream_ready:
        $ref: '#/components/messages/video_status_stream_ready'
      video_status_downloaded:
        $ref: '#/components/messages/video_status_downloaded'
      video_status_processed:
        $ref: '#/components/messages/video_status_processed'
      video_status_deleted:
        $ref: '#/components/messages/video_status_deleted'
      video_status_errored:
        $ref: '#/components/messages/video_status_errored'
      video_status_ready:
        $ref: '#/components/messages/video_status_ready'
      event_video_uploaded:
        $ref: '#/components/messages/event_video_uploaded'
      video_status_repackaged:
        $ref: '#/components/messages/video_status_repackaged'
      event_embed_viewed:
        $ref: '#/components/messages/event_embed_viewed'
      event_embed_cta_clicked:
        $ref: '#/components/messages/event_embed_cta_clicked'
      event_video_updated:
        $ref: '#/components/messages/event_video_updated'
      event_playlist_created:
        $ref: '#/components/messages/event_playlist_created'
      event_playlist_asset:
        $ref: '#/components/messages/event_playlist_asset'
      event_playlist_deleted:
        $ref: '#/components/messages/event_playlist_deleted'
      event_embed_form_submitted:
        $ref: '#/components/messages/event_embed_form_submitted'
      event_comment_all:
        $ref: '#/components/messages/event_comment_all'
      event_channel_member_joined:
        $ref: '#/components/messages/event_channel_member_joined'
      live_video_status_created:
        $ref: '#/components/messages/live_video_status_created'
      live_video_status_preparing:
        $ref: '#/components/messages/live_video_status_preparing'
      live_video_status_ready:
        $ref: '#/components/messages/live_video_status_ready'
      live_video_status_connected:
        $ref: '#/components/messages/live_video_status_connected'
      live_video_status_complete:
        $ref: '#/components/messages/live_video_status_complete'
      live_video_status_active:
        $ref: '#/components/messages/live_video_status_active'
      live_video_status_disconnected:
        $ref: '#/components/messages/live_video_status_disconnected'
operations:
  receiveWebhookEvent:
    action: receive
    channel:
      $ref: '#/channels/webhooks'
    summary: Receive a Gumlet webhook event at your endpoint.
    messages:
    - $ref: '#/channels/webhooks/messages/video_status_created'
    - $ref: '#/channels/webhooks/messages/video_status_stream_ready'
    - $ref: '#/channels/webhooks/messages/video_status_downloaded'
    - $ref: '#/channels/webhooks/messages/video_status_processed'
    - $ref: '#/channels/webhooks/messages/video_status_deleted'
    - $ref: '#/channels/webhooks/messages/video_status_errored'
    - $ref: '#/channels/webhooks/messages/video_status_ready'
    - $ref: '#/channels/webhooks/messages/event_video_uploaded'
    - $ref: '#/channels/webhooks/messages/video_status_repackaged'
    - $ref: '#/channels/webhooks/messages/event_embed_viewed'
    - $ref: '#/channels/webhooks/messages/event_embed_cta_clicked'
    - $ref: '#/channels/webhooks/messages/event_video_updated'
    - $ref: '#/channels/webhooks/messages/event_playlist_created'
    - $ref: '#/channels/webhooks/messages/event_playlist_asset'
    - $ref: '#/channels/webhooks/messages/event_playlist_deleted'
    - $ref: '#/channels/webhooks/messages/event_embed_form_submitted'
    - $ref: '#/channels/webhooks/messages/event_comment_all'
    - $ref: '#/channels/webhooks/messages/event_channel_member_joined'
    - $ref: '#/channels/webhooks/messages/live_video_status_created'
